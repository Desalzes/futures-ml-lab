[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-ml-lab"
version = "0.1.0"
description = "Public bar-only futures ML research interfaces and synthetic test harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "futures-ml-lab contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
